name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.0.0, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm orbifier.spec

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Orbifier ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ## Orbifier ${{ steps.tag.outputs.TAG_NAME }}

            ### Download
            Download `orbifier.exe` below and run it. No Python required!

            ### What's new
            See the [commit log](https://github.com/${{ github.repository }}/commits/${{ steps.tag.outputs.TAG_NAME }}) for details.

            ⚠️ EDUCATIONAL USE ONLY — USE AT YOUR OWN RISK. Faking game activity may violate Discord's ToS. See the Legal section of the README.
          files: dist/orbifier.exe
          draft: false
          prerelease: false
